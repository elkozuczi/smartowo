# Baza produktów używanych w artykułach na blogu.
#
# Klucz (np. shelly-2pm-gen4) to identyfikator, którego używasz w artykule:
#   {% include produkt.html id="shelly-2pm-gen4" %}                         → karta produktu z przyciskami
#   {% include produkt.html id="shelly-2pm-gen4" opis="Steruje roletą w salonie." %}  → karta z własnym opisem
#   {% include link.html id="shelly-2pm-gen4" %}                            → link w tekście (nazwa produktu)
#   {% include link.html id="shelly-2pm-gen4" tekst="ten moduł" %}          → link w tekście z własnym opisem
#
# Pola:
#   nazwa     — wymagane
#   kategoria — tylko do porządku w tym pliku (nie wyświetla się)
#   opis      — krótki opis na karcie; w artykule lepiej podać własny parametrem opis="..."
#   zdjecie   — ścieżka do własnego zdjęcia w /assets/produkty/ (opcjonalne).
#               Nie kopiuj zdjęć ze sklepów — regulamin Amazon tego zabrania.
#   cena      — orientacyjna cena (opcjonalne). Nie podawaj, jeśli jedynym linkiem jest Amazon:
#               program partnerski Amazon zabrania pokazywania cen nieaktualizowanych automatycznie.
#   linki     — lista sklepów; pierwszy to główny przycisk karty i link w tekście.
#               Amazon:      - sklep: "Amazon"  + asin: "B0..."   (tag partnera dokleja się z _config.yml → amazon_tag)
#               Inne sklepy: - sklep: "Botland" + url: "https://..." (gotowy link afiliacyjny)
#
# Oferty Amazon.pl wybrane i sprawdzone 2026-10-20: dla każdego modelu najtańsza oferta od zaufanego
# sprzedawcy (Shelly Europe, APRIMS, Amazon, Morele), najczęściej z wysyłką przez Amazon.
# Na Amazon ten sam produkt ma często kilka ofert z cenami różniącymi się nawet 4× — przed użyciem
# w artykule warto rzucić okiem, czy wybrana oferta jest wciąż korzystna.

