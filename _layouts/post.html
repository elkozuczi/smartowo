---
layout: default
---
<article class="section post">
  <div class="container container-narrow">
    <p class="post-back"><a href="/blog/">← Wróć do bloga</a></p>
    <p class="post-meta">{{ page.date | date: "%d.%m.%Y" }}{% if page.location %} · 📍 {{ page.location }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
