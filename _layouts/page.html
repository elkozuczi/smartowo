---
layout: default
---
<article class="section">
  <div class="container container-narrow">
    <p class="post-back"><a href="/">← Strona główna</a></p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.updated %}<p class="post-meta">Ostatnia aktualizacja: {{ page.updated | date: "%d.%m.%Y" }}</p>{% endif %}
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
